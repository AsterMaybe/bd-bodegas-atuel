services:
  # Base de datos PostgreSQL
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: bodegas_db:latest
    container_name: bodegas_db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-bodegas_atuel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
      - ./db/seed:/opt/seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bodegas_atuel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bodegas-network

  # API FastAPI
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: bodegas_api:latest
    container_name: bodegas_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-bodegas_atuel}
      PORT: "8000"
      ENV: production
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - bodegas-network

  # Frontend React + Nginx
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: bodegas_front:latest
    container_name: bodegas_front
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bodegas-network

volumes:
  postgres_data:

networks:
  bodegas-network:
    driver: bridge